    --bg:#090c12;
    --bg2:#0d1119;
    --glass:rgba(255,255,255,0.04);
    --glass-border:rgba(0,217,255,0.16);
    --cyan:#00d9ff;
    --rose:#ff6fae;
    --text:#e8ecf1;
    --muted:#8b96a5;
    --green:#3ddc97;
    --amber:#ffb84d;
    --red:#ff5470;
  }
  body[data-theme="light"]{
    --bg:#f4f6fa; --bg2:#ffffff; --glass:rgba(255,255,255,0.75);
    --glass-border:rgba(0,0,0,0.08); --cyan:#0091b3; --rose:#c23a72;
    --text:#12151b; --muted:#5a6270;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 20% 0%, #101728 0%, var(--bg) 45%), var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:0;
    position:relative;
    display:flex; flex-direction:column;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:var(--logo-url);
    background-repeat:no-repeat;
    background-position:center 28%;
    background-size:min(70vw, 480px);
    opacity:0.07;
    filter:drop-shadow(0 0 40px rgba(0,217,255,0.4));
    pointer-events:none;
    z-index:0;
  }
  header, main{position:relative; z-index:1;}
  h1,h2,h3,.brand,.ticket-num{font-family:'Orbitron',sans-serif;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--rose)); border-radius:3px;}

  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pulseDot{
    0%,100%{box-shadow:0 0 6px currentColor;}
    50%{box-shadow:0 0 14px currentColor;}
  }
  @keyframes shimmer{
    0%{background-position:-200% 0;}
    100%{background-position:200% 0;}
  }
  @keyframes crownGlow{
    0%,100%{opacity:.55; transform:scale(1);}
    50%{opacity:1; transform:scale(1.08);}
  }
  @keyframes popIn{
    0%{opacity:0; transform:scale(.7) rotate(-4deg);}
    60%{opacity:1; transform:scale(1.05) rotate(1deg);}
    100%{opacity:1; transform:scale(1) rotate(0);}
  }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 20px; position:sticky; top:0; z-index:20;
    background:rgba(9,12,18,0.85); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--glass-border);
  }
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--rose), transparent);
    opacity:.6;
  }
  .brand{
    font-size:20px; font-weight:900; letter-spacing:2px; color:var(--text);
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .brand::before{
    content:"♛"; font-size:16px; color:var(--rose);
    animation:crownGlow 2.8s ease-in-out infinite;
    text-shadow:0 0 10px var(--rose);
  }
  .brand span{
    background:linear-gradient(90deg, var(--cyan) 0%, var(--rose) 50%, var(--cyan) 100%);
    background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 5s linear infinite;
  }
  nav button{
    background:none; border:1px solid var(--glass-border); color:var(--muted);
    padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; font-weight:600;
    transition:.2s;
  }
  nav button.active{color:var(--bg); background:var(--cyan); border-color:var(--cyan);}
  main{max-width:520px; margin:0 auto; padding:24px 16px; flex:1 0 auto; width:100%;}
  .glass{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:18px;
    padding:20px; backdrop-filter:blur(10px); margin-bottom:16px;
    position:relative; overflow:hidden;
    animation:riseIn .45s ease both;
  }
  .glass::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--rose), transparent);
    opacity:.5;
  }
  .divider{
    display:flex; align-items:center; gap:10px; margin:22px 0; color:var(--muted);
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
  }
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--glass-border));}
  .divider::after{background:linear-gradient(90deg, var(--glass-border), transparent);}
  .status-banner{
    display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:14px;
    margin-bottom:18px; font-weight:600; font-size:14px;
    animation:riseIn .4s ease both;
  }
  .status-banner.open{background:rgba(61,220,151,0.12); border:1px solid rgba(61,220,151,0.35); color:var(--green);}
  .status-banner.closed{background:rgba(255,84,112,0.12); border:1px solid rgba(255,84,112,0.35); color:var(--red);}
  .dot{width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulseDot 1.6s ease-in-out infinite;}
  label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:1px;}
  input, select{
    width:100%; background:#0a0f18; border:1px solid rgba(255,255,255,0.08); color:var(--text);
    padding:12px 14px; border-radius:10px; font-size:15px; font-family:'Inter',sans-serif;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,217,255,0.12);}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    padding:9px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); background:#0a0f18;
    font-size:13px; cursor:pointer; color:var(--muted); font-weight:600;
    transition:transform .15s, background .15s, color .15s, border-color .15s;
  }
  .chip:active{transform:scale(.94);}
  .chip.sel{
    background:linear-gradient(135deg,var(--cyan),var(--rose)); color:#06090d; border-color:transparent;
    transform:scale(1.06); box-shadow:0 4px 14px rgba(0,217,255,0.25);
  }
  .btn{
    width:100%; margin-top:20px; padding:15px; border:none; border-radius:12px;
    background:linear-gradient(135deg,var(--cyan),var(--rose)); color:#06090d; font-weight:800;
    font-size:15px; letter-spacing:.5px; cursor:pointer;
    transition:transform .12s; position:relative; overflow:hidden;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.secondary{background:none; border:1px solid var(--glass-border); color:var(--text); font-weight:600;}
  .btn.danger{background:linear-gradient(135deg,var(--red),#ff8a5b);}
  .ticket{
    text-align:center; padding:36px 20px 30px;
    background:
      radial-gradient(circle 7px at 0 100%, transparent 7px, var(--glass) 7.5px),
      radial-gradient(circle 7px at 100% 100%, transparent 7px, var(--glass) 7.5px);
    position:relative;
    animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .ticket::after{
    content:""; position:absolute; left:14px; right:14px; bottom:14px; height:0;
    border-bottom:2px dashed rgba(255,255,255,0.12);
  }
  .ticket-num{font-size:64px; font-weight:900; color:var(--cyan); text-shadow:0 0 24px rgba(0,217,255,0.5); line-height:1;}
  .ticket p{color:var(--muted); margin-top:10px; font-size:13px;}
  .ticket .name{font-size:18px; font-weight:700; margin-top:14px; color:var(--text);}
  .landing-card{text-align:center; padding:34px 22px;}
  .landing-sub{color:var(--muted); font-size:13px; margin:8px 0 4px;}
  .landing-card .btn{margin-top:18px;}
  .form-body{
    transition:max-height .5s ease, opacity .4s ease, padding .4s ease, margin .4s ease;
  }
  .form-body.collapsed{
    max-height:0; opacity:0; padding-top:0; padding-bottom:0; margin-bottom:0;
    border-width:0; overflow:hidden;
  }
  .form-body.open{max-height:2000px; opacity:1;}
  .wait-ring{
    position:relative; width:150px; height:150px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .wait-ring::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:3px solid transparent;
    border-top-color:var(--cyan); border-right-color:var(--rose);
    animation:spin 1.4s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .wait-ring .ticket-num{font-size:44px;}
  /* admin */
  .login-box{max-width:340px; margin:80px auto 0;}
  .stats-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; text-align:center; padding:14px 8px;}
  .stat .n{font-size:26px; font-weight:900; font-family:'Orbitron';}
  .stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}
  .book-card{padding:14px 16px; margin-bottom:10px;}
  .book-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .book-num{font-family:'Orbitron'; font-weight:800; color:var(--cyan); font-size:18px;}
  .book-status{font-size:11px; padding:4px 10px; border-radius:12px; font-weight:700; text-transform:uppercase;}
  .st-pending{background:rgba(255,184,77,0.15); color:var(--amber);}
  .st-confirmed{background:rgba(61,220,151,0.15); color:var(--green);}
  .st-completed{background:rgba(139,150,165,0.15); color:var(--muted);}
  .st-cancelled{background:rgba(255,84,112,0.15); color:var(--red);}
  .book-meta{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.6;}
  .book-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
  .mini-btn{
    flex:1; min-width:70px; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
    background:#0a0f18; color:var(--text); font-size:12px; font-weight:600; cursor:pointer;
  }
  .mini-btn.on{border-color:var(--cyan); color:var(--cyan);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between;}
  .switch{position:relative; width:48px; height:26px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:#2a3140; border-radius:20px; cursor:pointer; transition:.2s;}
  .slider:before{content:''; position:absolute; height:20px; width:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  input:checked + .slider{background:var(--green);}
  input:checked + .slider:before{transform:translateX(22px);}
  .empty{text-align:center; padding:30px 10px; color:var(--muted); font-size:14px;}
  .err{color:var(--red); font-size:13px; margin-top:8px; display:none;}
  .search-box{margin-bottom:14px;}
  small.hint{display:block; color:var(--muted); font-size:11px; margin-top:6px;}
  footer{
    text-align:center; padding:26px 16px 22px; color:var(--muted); font-size:11px;
    position:relative; z-index:1; letter-spacing:.5px; flex-shrink:0;
  }
  footer .powered{
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:1.5px; font-weight:700;
    margin-bottom:4px;
  }
  footer .powered span{
    background:linear-gradient(90deg, var(--cyan), var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
</style>
</head>
<body>

<header>
  <div class="brand" id="brandLogo">FJ <span>SALOON</span></div>
  <nav>
    <button id="navBook" class="active">Book</button>
    <button id="themeToggle">☀ Light</button>
  </nav>
</header>

<main id="app"></main>

<footer>
  <div class="powered">Powered by <span>RUSH Environment</span></div>
  <div>© 2026 FJ Saloon · Art of Magic. All rights reserved.</div>
</footer>

<script>
/* ====== FIREBASE CONFIG ======
   Replace with your project's config (Firebase Console > Project Settings).
   Same pattern as config.js used elsewhere on Rush2 — keep this out of
   public commits if you don't want the config visible in source, though
   for Firestore the security rules matter more than hiding the config.
*/
const firebaseConfig = {
  apiKey: "AIzaSyB6Oo1p0OVnqf9B_pD8jrQAyQbzU0WF278",
  authDomain: "fj-saloon.firebaseapp.com",
  projectId: "fj-saloon",
  storageBucket: "fj-saloon.firebasestorage.app",
  messagingSenderId: "427324767239",
  appId: "1:427324767239:web:3b886876c983694e2afea2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Owner password — default fallback, actual password lives in Firestore
   once changed via Settings so it persists across devices. */
const OWNER_PASSWORD = "fj0000";
async function getOwnerPassword(){
  try{
    const doc = await getSettingsDoc().get();
    const data = doc.data() || {};
    return data.ownerPassword || OWNER_PASSWORD;
  }catch(e){
    return OWNER_PASSWORD;
  }
}

const SERVICES = ["Hair Cut","Beard Trim","Hair Colour","Facial","Head Massage","Shave","Fire Cutting","Hair Straightening"];
const SERVICE_ICONS = {"Hair Cut":"✂️","Beard Trim":"🪒","Hair Colour":"🎨","Facial":"✨","Head Massage":"💆","Shave":"🪞","Fire Cutting":"🔥","Hair Straightening":"💇"};
const SLOTS = ["9:00 AM","10:00 AM","11:00 AM","12:00 PM","1:00 PM","2:00 PM","3:00 PM","4:00 PM","5:00 PM","6:00 PM","7:00 PM"];

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayLabel(){
  return new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}

/* Theme toggle — default (dark/transparent) vs Light, remembered per device */
(function(){
  const btn = document.getElementById("themeToggle");
  const isLight = localStorage.getItem("fj_theme") === "light";
  if(isLight){ document.body.setAttribute("data-theme", "light"); btn.textContent = "● Dark"; }
  btn.onclick = () => {
    const nowLight = document.body.getAttribute("data-theme") === "light";
    if(nowLight){
      document.body.removeAttribute("data-theme");
      localStorage.setItem("fj_theme", "default");
      btn.textContent = "☀ Light";
    }else{
      document.body.setAttribute("data-theme", "light");
      localStorage.setItem("fj_theme", "light");
      btn.textContent = "● Dark";
    }
  };
})();

const app = document.getElementById("app");
const navBook = document.getElementById("navBook");
const brandLogo = document.getElementById("brandLogo");
let view = "book";
let selectedService = null;
let selectedSlot = null;
let unsubscribe = null;
let settingsUnsub = null;
let bookingUnsub = null;
let isOwner = sessionStorage.getItem("fj_owner") === "1";
let adminSubView = "dashboard";

navBook.onclick = () => { view = "book"; history.replaceState(null,"",location.pathname); render(); };

/* Secret owner access — no visible button.
   Tap the "FJ SALOON" logo 5 times within 2 seconds, OR open the page
   with #owner at the end of the URL (e.g. yoursite.html#owner). */
let tapCount = 0, tapTimer = null;
brandLogo.onclick = () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount = 0; }, 2000);
  if(tapCount >= 5){
    tapCount = 0;
    view = "admin";
    render();
  }
};
if(location.hash === "#owner"){
  view = "admin";
}

function setActive(){
  navBook.classList.toggle("active", view==="book");
}

/* ---------- SETTINGS (open/closed for today) ---------- */
function getSettingsDoc(){
  return db.collection("settings").doc("shop");
}

/* Atomic counter so two customers booking at the same time never get
   the same booking number. Resets naturally since the counter doc is
   keyed by today's date. */
function getNextBookingNumber(date){
  const counterRef = db.collection("counters").doc(date);
  return db.runTransaction(async (tx) => {
    const doc = await tx.get(counterRef);
    const current = doc.exists ? doc.data().count : 0;
    const next = current + 1;
    tx.set(counterRef, {count: next});
    return next;
  });
}

/* ================= CUSTOMER BOOKING VIEW ================= */
function activeBookingKey(){ return "fj_active_booking_" + todayStr(); }

function renderBook(){
  setActive();
  const activeId = localStorage.getItem(activeBookingKey());
  if(activeId){
    renderBookingStatus(activeId);
    return;
  }
  renderBookingForm();
}

function renderBookingStatus(bookingId){
  app.innerHTML = `<div id="statusArea"></div>`;
  if(bookingUnsub) bookingUnsub();
  bookingUnsub = db.collection("bookings").doc(bookingId).onSnapshot(doc=>{
    const area = document.getElementById("statusArea");
    if(!area) return;
    if(!doc.exists){
      localStorage.removeItem(activeBookingKey());
      renderBookingForm();
      return;
    }
    const b = doc.data();
    if(b.status === "cancelled"){
      area.innerHTML = `
        <div class="glass ticket">
          <div class="ticket-num" style="color:var(--red);">#${b.bookingNumber}</div>
          <p>Your booking was cancelled by the salon</p>
          <div class="name">${b.name}</div>
          <button class="btn" id="rebookBtn" style="margin-top:20px;">Book Again</button>
        </div>
      `;
      document.getElementById("rebookBtn").onclick = () => {
        localStorage.removeItem(activeBookingKey());
        renderBookingForm();
      };
      return;
    }
    if(b.status === "completed"){
      area.innerHTML = `
        <div class="glass ticket">
          <div class="ticket-num" style="color:var(--green);">#${b.bookingNumber}</div>
          <p>Service completed — thank you!</p>
          <div class="name">${b.name}</div>
          <button class="btn" id="rebookBtn" style="margin-top:20px;">Book Again</button>
        </div>
      `;
      document.getElementById("rebookBtn").onclick = () => {
        localStorage.removeItem(activeBookingKey());
        renderBookingForm();
      };
      return;
    }
    if(b.status === "confirmed"){
      area.innerHTML = `
        <div class="glass ticket">
          <div class="ticket-num">#${b.bookingNumber}</div>
          <p>Your booking for today</p>
          <div class="name">${b.name}</div>
          <p>${b.service} · ${b.slot}</p>
          <p style="margin-top:14px;color:var(--green);">✓ Confirmed by the salon</p>
        </div>
      `;
      return;
    }
    // pending — live waiting screen
    area.innerHTML = `
      <div class="glass ticket">
        <div class="wait-ring"><div class="ticket-num">#${b.bookingNumber}</div></div>
        <p>${b.name} · ${b.service} · ${b.slot}</p>
        <p style="margin-top:14px;color:var(--amber);">Waiting for the salon to confirm your booking…</p>
        <small class="hint">This updates automatically — no need to refresh.</small>
      </div>
    `;
  });
}

function renderBookingForm(){
  selectedService = null; selectedSlot = null;
  app.innerHTML = `
    <div id="statusBanner"></div>
    <div class="glass landing-card" id="landingCard">
      <h2 style="font-size:16px;letter-spacing:1px;">${todayLabel()}</h2>
      <p class="landing-sub">Tap below to grab your booking number</p>
      <button class="btn" id="openFormBtn">✦ Tap to Book</button>
    </div>
    <div class="glass form-body collapsed" id="formCard">
      <label>Your Name</label>
      <input id="fName" type="text" placeholder="Full name" />
      <label>Age</label>
      <input id="fAge" type="number" min="1" max="120" placeholder="Age" />
      <label>Phone Number</label>
      <input id="fPhone" type="tel" placeholder="10-digit phone number" />
      <label>Service</label>
      <div class="chip-row" id="serviceChips"></div>
      <div class="divider">✦</div>
      <label>Preferred Time</label>
      <div class="chip-row" id="slotChips"></div>
      <div class="err" id="formErr"></div>
      <button class="btn" id="bookBtn">Book Now</button>
      <small class="hint">Booking number is assigned automatically and resets every day.</small>
    </div>
    <div id="ticketArea"></div>
  `;

  document.getElementById("openFormBtn").onclick = () => {
    document.getElementById("landingCard").style.display = "none";
    const formCard = document.getElementById("formCard");
    formCard.classList.remove("collapsed");
    formCard.classList.add("open");
  };

  const svcWrap = document.getElementById("serviceChips");
  SERVICES.forEach(s=>{
    const c = document.createElement("div");
    c.className = "chip"; c.textContent = `${SERVICE_ICONS[s] || ""} ${s}`;
    c.onclick = () => { selectedService = s; [...svcWrap.children].forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); };
    svcWrap.appendChild(c);
  });
  const slotWrap = document.getElementById("slotChips");
  SLOTS.forEach(s=>{
    const c = document.createElement("div");
    c.className = "chip"; c.textContent = s;
    c.onclick = () => { selectedSlot = s; [...slotWrap.children].forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); };
    slotWrap.appendChild(c);
  });

  let shopOpen = true;
  if(settingsUnsub) settingsUnsub();
  settingsUnsub = getSettingsDoc().onSnapshot(doc=>{
    const data = doc.data() || {};
    const offDates = data.offDates || [];
    shopOpen = !offDates.includes(todayStr());
    const banner = document.getElementById("statusBanner");
    if(!banner) return;
    banner.innerHTML = shopOpen
      ? `<div class="status-banner open"><span class="dot"></span> Open today — booking available</div>`
      : `<div class="status-banner closed"><span class="dot"></span> Closed today — owner has paused bookings</div>`;
    const openBtn = document.getElementById("openFormBtn");
    const bookBtn = document.getElementById("bookBtn");
    if(openBtn) openBtn.disabled = !shopOpen;
    if(bookBtn) bookBtn.disabled = !shopOpen;
  });

  document.getElementById("bookBtn").onclick = async () => {
    const name = document.getElementById("fName").value.trim();
    const age = document.getElementById("fAge").value.trim();
    const phone = document.getElementById("fPhone").value.trim();
    const errEl = document.getElementById("formErr");
    errEl.style.display = "none";

    if(!name || !age || !phone || !selectedService || !selectedSlot){
      errEl.textContent = "Fill all fields, and pick a service and time.";
      errEl.style.display = "block";
      return;
    }
    if(!/^[0-9]{10}$/.test(phone)){
      errEl.textContent = "Enter a valid 10-digit phone number.";
      errEl.style.display = "block";
      return;
    }

    const btn = document.getElementById("bookBtn");
    btn.disabled = true; btn.textContent = "Booking...";

    try{
      const date = todayStr();
      const bookingNumber = await getNextBookingNumber(date);

      const docRef = await db.collection("bookings").add({
        bookingNumber, date, name, age, phone,
        service: selectedService, slot: selectedSlot,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      localStorage.setItem(activeBookingKey(), docRef.id);
      if(settingsUnsub){ settingsUnsub(); settingsUnsub = null; }
      renderBookingStatus(docRef.id);
    }catch(e){
      errEl.textContent = "Something went wrong. Check your Firebase setup and try again.";
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Book Now";
      console.error(e);
    }
  };
}

/* ================= OWNER ADMIN VIEW ================= */
function renderAdminSettings(){
  app.innerHTML = `
    <div class="glass">
      <h2 style="font-size:16px;margin-bottom:14px;">Admin Settings</h2>
      <label>Current Password</label>
      <input id="curPass" type="password" placeholder="Current password" />
      <label>New Password</label>
      <input id="newPass" type="password" placeholder="New password" />
      <label>Confirm New Password</label>
      <input id="confPass" type="password" placeholder="Re-enter new password" />
      <div class="err" id="settingsErr"></div>
      <div id="settingsOk" style="display:none;color:var(--green);font-size:13px;margin-top:10px;">Password updated.</div>
      <button class="btn" id="savePassBtn">Save New Password</button>
    </div>
    <button class="btn secondary" id="backBtn">← Back to Dashboard</button>
  `;

  document.getElementById("backBtn").onclick = () => {
    adminSubView = "dashboard";
    renderAdmin();
  };

  document.getElementById("savePassBtn").onclick = async () => {
    const cur = document.getElementById("curPass").value;
    const next = document.getElementById("newPass").value;
    const conf = document.getElementById("confPass").value;
    const errEl = document.getElementById("settingsErr");
    const okEl = document.getElementById("settingsOk");
    errEl.style.display = "none"; okEl.style.display = "none";

    if(!cur || !next || !conf){
      errEl.textContent = "Fill all fields.";
      errEl.style.display = "block";
      return;
    }
    if(next !== conf){
      errEl.textContent = "New passwords don't match.";
      errEl.style.display = "block";
      return;
    }
    if(next.length < 4){
      errEl.textContent = "New password should be at least 4 characters.";
      errEl.style.display = "block";
      return;
    }

    const btn = document.getElementById("savePassBtn");
    btn.disabled = true; btn.textContent = "Saving...";
    const stored = await getOwnerPassword();
    if(cur !== stored){
      errEl.textContent = "Current password is wrong.";
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Save New Password";
      return;
    }

    await getSettingsDoc().set({ownerPassword: next}, {merge:true});
    okEl.style.display = "block";
    document.getElementById("curPass").value = "";
    document.getElementById("newPass").value = "";
    document.getElementById("confPass").value = "";
    btn.disabled = false; btn.textContent = "Save New Password";
  };
}

function renderAdmin(){
  setActive();
  if(!isOwner){
    app.innerHTML = `
      <div class="glass login-box">
        <h2 style="font-size:18px;margin-bottom:14px;">Owner Login</h2>
        <label>Password</label>
        <input id="ownerPass" type="password" placeholder="Enter owner password" />
        <div class="err" id="loginErr"></div>
        <button class="btn" id="loginBtn">Login</button>
      </div>
    `;
    document.getElementById("loginBtn").onclick = async () => {
      const val = document.getElementById("ownerPass").value;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      const stored = await getOwnerPassword();
      btn.disabled = false;
      if(val === stored){
        isOwner = true; sessionStorage.setItem("fj_owner","1");
        adminSubView = "dashboard";
        renderAdmin();
      }else{
        const e = document.getElementById("loginErr");
        e.textContent = "Wrong password.";
        e.style.display = "block";
      }
    };
    return;
  }

  if(adminSubView === "settings"){ renderAdminSettings(); return; }

  app.innerHTML = `
    <div class="glass">
      <div class="toggle-row">
        <div>
          <h2 style="font-size:16px;">Shop Status — ${todayLabel()}</h2>
          <small class="hint" id="shopStatusText">Loading...</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="openToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="stats-row">
      <div class="glass stat"><div class="n" id="statTotal">0</div><div class="l">Today</div></div>
      <div class="glass stat"><div class="n" id="statPending">0</div><div class="l">Pending</div></div>
      <div class="glass stat"><div class="n" id="statConfirmed">0</div><div class="l">Confirmed</div></div>
    </div>
    <input class="search-box" id="searchPhone" type="text" placeholder="Search by phone number" style="background:#0a0f18;border:1px solid rgba(255,255,255,0.08);color:var(--text);padding:12px 14px;border-radius:10px;width:100%;" />
    <div id="bookingsList"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn secondary" id="settingsBtn" style="margin-top:0;">⚙ Settings</button>
      <button class="btn secondary" id="logoutBtn" style="margin-top:0;">Log Out</button>
    </div>
  `;

  document.getElementById("settingsBtn").onclick = () => {
    adminSubView = "settings";
    renderAdmin();
  };
  document.getElementById("logoutBtn").onclick = () => {
    isOwner = false; sessionStorage.removeItem("fj_owner");
    if(unsubscribe) unsubscribe();
    renderAdmin();
  };

  const toggle = document.getElementById("openToggle");
  getSettingsDoc().onSnapshot(doc=>{
    const data = doc.data() || {};
    const offDates = data.offDates || [];
    const closed = offDates.includes(todayStr());
    toggle.checked = !closed;
    document.getElementById("shopStatusText").textContent = closed ? "Marked OFF — customers can't book today" : "Open for bookings";
  });
  toggle.onchange = async () => {
    const date = todayStr();
    const docSnap = await getSettingsDoc().get();
    let offDates = (docSnap.data() && docSnap.data().offDates) || [];
    if(toggle.checked){
      offDates = offDates.filter(d=>d!==date);
    }else{
      if(!offDates.includes(date)) offDates.push(date);
    }
    await getSettingsDoc().set({offDates}, {merge:true});
  };

  const searchInput = document.getElementById("searchPhone");
  searchInput.oninput = () => renderBookingsList(searchInput.value.trim());

  if(unsubscribe) unsubscribe();
  unsubscribe = db.collection("bookings").where("date","==",todayStr())
    .onSnapshot(snap=>{
      window._todayBookings = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.bookingNumber-b.bookingNumber);
      renderBookingsList(searchInput.value.trim());
    });
}

function renderBookingsList(filterPhone){
  const list = document.getElementById("bookingsList");
  if(!list) return;
  let bookings = window._todayBookings || [];

  document.getElementById("statTotal").textContent = bookings.length;
  document.getElementById("statPending").textContent = bookings.filter(b=>b.status==="pending").length;
  document.getElementById("statConfirmed").textContent = bookings.filter(b=>b.status==="confirmed").length;

  if(filterPhone){
    bookings = bookings.filter(b=>b.phone.includes(filterPhone));
  }

  if(bookings.length === 0){
    list.innerHTML = `<div class="empty">No bookings yet today.</div>`;
    return;
  }

  list.innerHTML = bookings.map(b => `
    <div class="glass book-card">
      <div class="book-top">
        <div><span class="book-num">#${b.bookingNumber}</span></div>
        <div class="book-status st-${b.status}">${b.status}</div>
      </div>
      <div class="book-meta">
        ${b.name} · Age ${b.age} · ${b.phone}<br/>
        ${b.service} · ${b.slot}
      </div>
      <div class="book-actions">
        <button class="mini-btn ${b.status==='confirmed'?'on':''}" onclick="updateStatus('${b.id}','confirmed')">Confirm</button>
        <button class="mini-btn ${b.status==='pending'?'on':''}" onclick="updateStatus('${b.id}','pending')">Pending</button>
        <button class="mini-btn ${b.status==='completed'?'on':''}" onclick="updateStatus('${b.id}','completed')">Done</button>
        <button class="mini-btn ${b.status==='cancelled'?'on':''}" onclick="updateStatus('${b.id}','cancelled')">Cancel</button>
      </div>
    </div>
  `).join("");
}

function updateStatus(id, status){
  db.collection("bookings").doc(id).update({status});
}
window.updateStatus = updateStatus;

function render(){
  if(unsubscribe && view==="book"){ unsubscribe(); unsubscribe=null; }
  if(settingsUnsub && view!=="book"){ settingsUnsub(); settingsUnsub=null; }
  if(bookingUnsub && view!=="book"){ bookingUnsub(); bookingUnsub=null; }
  if(view === "book") renderBook();
  else renderAdmin();
}
render();
</script>
</body>
</html>
